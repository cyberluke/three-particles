<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>probe</title></head>
<body><pre id="out">start</pre>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
    "three/": "https://cdn.jsdelivr.net/npm/three@0.186.0/",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.tsl.js",
    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
    "THREE": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.webgpu.js",
    "@newkrok/three-utils": "https://cdn.jsdelivr.net/npm/@newkrok/three-utils@2.0.2/dist/index.js",
    "@newkrok/three-utils/assets": "https://cdn.jsdelivr.net/npm/@newkrok/three-utils@2.0.2/dist/assets/index.js",
    "@newkrok/three-utils/audio": "https://cdn.jsdelivr.net/npm/@newkrok/three-utils@2.0.2/dist/audio/index.js",
    "easing-functions": "https://cdn.jsdelivr.net/npm/easing-functions@1.3.0/+esm",
    "three-noise/build/three-noise.module.js": "https://cdn.jsdelivr.net/npm/three-noise@1.1.2/build/three-noise.module.js",
    "@cyberluke/three-particles": "./three-particles.esm.js",
    "@cyberluke/three-particles/webgpu": "./three-particles-webgpu.esm.js"
  }
}
</script>
<script type="module">
  const out = [];
  const m = await import('./three-particles.esm.js');
  out.push('main ' + typeof m.createElectricArc + ' ' + m.REVISION);
  try {
    const w = await import('./three-particles-webgpu.esm.js');
    out.push('webgpu ' + typeof w.enableWebGPU);
  } catch (e) { out.push('webgpu ERR ' + e.message); }
  try {
    const t = await import('three/tsl');
    out.push('tsl ' + typeof t.pass);
  } catch (e) { out.push('tsl ERR ' + e.message); }
  try {
    const b = await import('three/addons/tsl/display/BloomNode.js');
    out.push('bloom ' + typeof b.bloom);
  } catch (e) { out.push('bloom ERR ' + e.message); }
  document.getElementById('out').textContent = out.join('\n');
</script>
</body>
</html>
